name: Daily Update & Model Recalculation Pipeline

on:
  schedule:
    # 2026-11-06 Phase 2: 用戶批准恢復 GitHub 原生排程（每小時 37 分 off-peak）。
    # 外部觸發（assistant cron）須同步停用，否則重複跑；停用外部觸發由我負責，不在本次 commit 做。
    - cron: "37 * * * *"
  workflow_dispatch:

concurrency:
  group: ww3-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: "614ee93b-e679-4b1b-a874-7a8b7260d6d6"
      WW3_API_BASE: ${{ vars.WW3_API_BASE || 'https://ww3-risk-api.whymeymmy.workers.dev' }}
      PYTHONPATH: "src"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run test suite
        run: |
          python -m pytest

      - name: Run real-time pulse fetcher
        run: |
          echo "Running real-time pulse fetcher..."
          python scripts/fetchers/pulse.py --output data/pulse_latest.json

      - name: Generate D1 snapshot JSON
        run: |
          python -m ww3_risk.cli --scenario scenarios/baseline_2026.json --export-snapshot current_snapshot.json

      - name: Push snapshot to Cloudflare D1
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Pushing snapshot to Cloudflare D1..."
            python scripts/push_snapshot.py current_snapshot.json
          else
            echo "::notice ::Skipping D1 push: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret is not set."
          fi

      - name: Run World Bank fetcher and Publication checker
        run: |
          echo "Running World Bank fetcher..."
          python scripts/fetchers/worldbank.py --baseline data/baseline_2026.json --output data/candidates/worldbank_candidates.json
          echo "Running publication release checker..."
          python scripts/fetchers/publication_checker.py --output data/candidates/publication-check.json

      - name: Commit updated pulse and candidates if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/candidates data/pulse_latest.json 2>/dev/null; then
            echo "Detected changes in pulse or candidates, committing..."
            git add data/candidates data/pulse_latest.json
            git commit -m "chore(data): update pulse signals and candidate observations [skip ci]"
            git push
          else
            echo "No changes in pulse or candidate observations."
          fi

      - name: Build dynamic dashboard HTML with API base
        run: |
          API_BASE="${WW3_API_BASE:-https://ww3-risk-api.whymeymmy.workers.dev}"
          echo "Building dashboard with api-base: $API_BASE"
          python -m ww3_risk.cli --scenario scenarios/baseline_2026.json --dashboard ui/dashboard.html --api-base "$API_BASE"

      - name: Prepare Pages staging deployment directory
        run: |
          mkdir -p staging
          cp ui/dashboard.html staging/index.html
          cp ui/dashboard.html staging/dashboard.html
          if [ -f "ui/dashboard_data.json" ]; then
            cp ui/dashboard_data.json staging/dashboard_data.json
          fi
          if [ -f "data/protests_snapshot.json" ]; then
            cp data/protests_snapshot.json staging/protests_snapshot.json
          fi

      - name: Deploy dynamic dashboard to Cloudflare Pages (with retry)
        id: deploy
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Deploying staging/ directory to Cloudflare Pages project 'ww3-risk-model'..."
            MAX_ATTEMPTS=3
            DELAY_SECONDS=60
            for attempt in $(seq 1 $MAX_ATTEMPTS); do
              echo "Attempt $attempt/$MAX_ATTEMPTS: npx wrangler pages deploy staging --project-name=ww3-risk-model"
              if npx wrangler pages deploy staging --project-name=ww3-risk-model; then
                echo "Deployment succeeded on attempt $attempt"
                exit 0
              else
                echo "Attempt $attempt failed"
                if [ $attempt -lt $MAX_ATTEMPTS ]; then
                  echo "Waiting $DELAY_SECONDS seconds before retry..."
                  sleep $DELAY_SECONDS
                fi
              fi
            done
            echo "All $MAX_ATTEMPTS attempts failed"
            exit 1
          else
            echo "::notice ::Skipping Pages deployment: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret is not set."
          fi

      - name: Validate deployment (post-deploy checks)
        id: validate
        if: always() && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          API_BASE="${WW3_API_BASE:-https://ww3-risk-api.whymeymmy.workers.dev}"
          echo "Validating deployment at $API_BASE"

          # Check /api/risk/latest
          echo "Checking $API_BASE/api/risk/latest..."
          LATEST_RESPONSE=$(curl -s -w "\n%{http_code}" "$API_BASE/api/risk/latest" || echo -e "\n000")
          LATEST_HTTP_CODE=$(echo "$LATEST_RESPONSE" | tail -n1)
          LATEST_BODY=$(echo "$LATEST_RESPONSE" | head -n -1)

          if [ "$LATEST_HTTP_CODE" != "200" ]; then
            echo "::error ::/api/risk/latest returned HTTP $LATEST_HTTP_CODE"
            exit 1
          fi

          python3 -c "import json, sys, datetime; data=json.loads('''$LATEST_BODY'''); computed_at=data.get('computed_at'); assert computed_at, 'computed_at missing'; dt=datetime.datetime.fromisoformat(computed_at.replace('Z', '+00:00')); now=datetime.datetime.now(datetime.timezone.utc); diff_hours=(now-dt).total_seconds()/3600; assert diff_hours<=2, f'computed_at too old: {diff_hours:.1f}h'; print(f'computed_at OK: {diff_hours:.1f}h')"

          # Check /api/data-status
          echo "Checking $API_BASE/api/data-status..."
          STATUS_RESPONSE=$(curl -s -w "\n%{http_code}" "$API_BASE/api/data-status" || echo -e "\n000")
          STATUS_HTTP_CODE=$(echo "$STATUS_RESPONSE" | tail -n1)
          STATUS_BODY=$(echo "$STATUS_RESPONSE" | head -n -1)

          if [ "$STATUS_HTTP_CODE" != "200" ]; then
            echo "::error ::/api/data-status returned HTTP $STATUS_HTTP_CODE"
            exit 1
          fi

          python3 -c "import json, sys; data=json.loads('''$STATUS_BODY'''); total=data.get('total'); assert total==36, f'total != 36 (got {total})'; print(f'data-status total OK: {total}')"

          echo "All post-deploy validation checks passed"

      - name: Alert on failure (create Issue)
        if: failure()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TRIGGER="${{ github.event_name }}"
          JOB_NAME="update-and-deploy"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          
          # Determine which stage failed
          FAILED_STAGE="unknown"
          if [ "${{ steps.deploy.outcome }}" == "failure" ]; then
            FAILED_STAGE="部署"
          elif [ "${{ steps.validate.outcome }}" == "failure" ]; then
            FAILED_STAGE="驗證"
          elif [ "${{ steps['Run test suite'].outcome }}" == "failure" ] || [ "${{ steps['Run real-time pulse fetcher'].outcome }}" == "failure" ] || [ "${{ steps['Generate D1 snapshot JSON'].outcome }}" == "failure" ] || [ "${{ steps['Push snapshot to Cloudflare D1'].outcome }}" == "failure" ] || [ "${{ steps['Run World Bank fetcher and Publication checker'].outcome }}" == "failure" ]; then
            FAILED_STAGE="數據"
          fi
          
          TITLE="[ww3-pipeline] update.yml failed $TIMESTAMP"
          BODY="Workflow run: $RUN_URL\nTrigger: $TRIGGER\nFailed job: $JOB_NAME\nFailed stage: $FAILED_STAGE (數據／部署／驗證三段中哪段失敗)\n===\nSee run for details: $RUN_URL"

          gh issue create --title "$TITLE" --body "$BODY" --label "pipeline-failure"
        env:
          GH_TOKEN: ${{ github.token }}