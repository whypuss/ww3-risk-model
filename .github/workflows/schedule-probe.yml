name: Schedule Probe

# 2026-11-27: Probe experiment concluded (136 samples from 2026-10-22 to 2026-11-26 proved
# native hourly GitHub schedule drops to ~8.2h average interval). Disabled recurring cron to
# stop unnecessary [skip ci] commit churn and git push races with update.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Echo runtime context
        run: |
          echo "Current UTC Time: $(date -u -Iseconds)"
          echo "github.event_name: ${{ github.event_name }}"
          echo "github.ref: ${{ github.ref }}"

      - name: Append probe log entry
        run: |
          mkdir -p data
          UTC_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"ts\": \"$UTC_ISO\", \"event\": \"${{ github.event_name }}\", \"run_id\": ${{ github.run_id }}}" >> data/probe_log.jsonl

      - name: Commit and push probe tick
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe_log.jsonl
          git commit -m "chore(probe): schedule probe tick [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
