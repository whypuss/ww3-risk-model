name: Schedule Probe

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Echo runtime context
        run: |
          echo "Current UTC Time: $(date -u -Iseconds)"
          echo "github.event_name: ${{ github.event_name }}"
          echo "github.ref: ${{ github.ref }}"

      - name: Append probe log entry
        run: |
          mkdir -p data
          UTC_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"ts\": \"$UTC_ISO\", \"event\": \"${{ github.event_name }}\", \"run_id\": ${{ github.run_id }}}" >> data/probe_log.jsonl

      - name: Commit and push probe tick
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe_log.jsonl
          git commit -m "chore(probe): schedule probe tick [skip ci]"
          git pull --rebase
          git push
