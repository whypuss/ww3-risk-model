name: Watchdog (Missed Run Detection & Catch-up)

on:
  schedule:
    # Check every 2 hours off-peak as GitHub-side backup; automatically closes resolved alerts.
    - cron: "7 */2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest

    env:
      WW3_API_BASE: ${{ vars.WW3_API_BASE || 'https://ww3-risk-api.whymeymmy.workers.dev' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get last successful update.yml run
        id: last_run
        run: |
          RUN_INFO=$(gh run list --workflow update.yml --status success --limit 1 --json createdAt,conclusion 2>/dev/null || echo "[]")
          echo "Raw run info: $RUN_INFO"
          CREATED_AT=$(echo "$RUN_INFO" | python3 -c "import json, sys; data=json.load(sys.stdin); print(data[0].get('createdAt', '') if data else '')")
          echo "LAST_SUCCESS_CREATED_AT=$CREATED_AT" >> "$GITHUB_OUTPUT"
          echo "Last successful run at: ${CREATED_AT:-none}"

      - name: Get API computed_at
        id: api_status
        run: |
          API_BASE="${WW3_API_BASE:-https://ww3-risk-api.whymeymmy.workers.dev}"
          echo "Querying $API_BASE/api/risk/latest..."
          HTTP_CODE=$(curl -sS -o /tmp/watchdog_latest.json -w "%{http_code}" "$API_BASE/api/risk/latest" || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            COMPUTED_AT=$(python3 -c "import json, pathlib; print(json.loads(pathlib.Path('/tmp/watchdog_latest.json').read_text()).get('computed_at', ''))")
            echo "API_COMPUTED_AT=$COMPUTED_AT" >> "$GITHUB_OUTPUT"
            echo "API computed_at: $COMPUTED_AT"
          else
            echo "API_COMPUTED_AT=" >> "$GITHUB_OUTPUT"
            echo "API request failed with HTTP $HTTP_CODE"
          fi

      - name: Evaluate staleness and decide catch-up
        id: evaluate
        run: |
          LAST_RUN="${{ steps.last_run.outputs.LAST_SUCCESS_CREATED_AT }}"
          API_TIME="${{ steps.api_status.outputs.API_COMPUTED_AT }}"
          python3 - <<PY >> "$GITHUB_OUTPUT"
          import datetime

          now = datetime.datetime.now(datetime.timezone.utc)
          last_run = "${LAST_RUN}".strip()
          api_time = "${API_TIME}".strip()

          def age_minutes(ts):
              if not ts:
                  return None
              dt = datetime.datetime.fromisoformat(ts.replace("Z", "+00:00"))
              return (now - dt).total_seconds() / 60.0

          run_age = age_minutes(last_run)
          api_age = age_minutes(api_time)

          # Trigger catch-up if live API data is older than 120 minutes OR update.yml hasn't run in 150 minutes
          stale_api = (api_age is None) or (api_age > 120)
          stale_run = (run_age is None) or (run_age > 150)
          should_trigger = stale_api or stale_run

          print(f"RUN_AGE_MIN={round(run_age, 1) if run_age is not None else 'unknown'}")
          print(f"API_AGE_MIN={round(api_age, 1) if api_age is not None else 'unknown'}")
          print(f"STALE_RUN={'true' if stale_run else 'false'}")
          print(f"STALE_API={'true' if stale_api else 'false'}")
          print(f"SHOULD_TRIGGER={'true' if should_trigger else 'false'}")
          PY

      - name: Trigger catch-up run of update.yml
        if: steps.evaluate.outputs.SHOULD_TRIGGER == 'true'
        run: |
          echo "Staleness detected (run_age=${{ steps.evaluate.outputs.RUN_AGE_MIN }}m, api_age=${{ steps.evaluate.outputs.API_AGE_MIN }}m). Triggering update.yml..."
          gh workflow run update.yml

      - name: Create alert issue if severely stale (> 180 min)
        if: steps.evaluate.outputs.STALE_API == 'true' && steps.evaluate.outputs.STALE_RUN == 'true'
        run: |
          EXISTING=$(gh issue list --state open --label "watchdog" --limit 1 --json number --jq '.[0].number // ""' 2>/dev/null || echo "")
          if [ -z "$EXISTING" ]; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            gh issue create \
              --title "[ww3-watchdog] 超過 2.5 小時無成功更新" \
              --body "Watchdog detected stale pipeline at $TIMESTAMP.\n\nLast successful update.yml run: ${{ steps.last_run.outputs.LAST_SUCCESS_CREATED_AT }} (${{ steps.evaluate.outputs.RUN_AGE_MIN }}m ago)\nAPI computed_at: ${{ steps.api_status.outputs.API_COMPUTED_AT }} (${{ steps.evaluate.outputs.API_AGE_MIN }}m ago)\n\nA catch-up run of update.yml has been triggered." \
              --label "watchdog" || true
          else
            echo "Existing open watchdog issue #$EXISTING already tracks this alert."
          fi

      - name: Auto-close open watchdog issues when healthy
        if: steps.evaluate.outputs.SHOULD_TRIGGER == 'false'
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          OPEN_NUMS=$(gh issue list --state open --label "watchdog" --json number --jq '.[].number' 2>/dev/null || echo "")
          for NUM in $OPEN_NUMS; do
            echo "Closing resolved watchdog issue #$NUM"
            gh issue close "$NUM" --comment "Auto-closed by Watchdog at $TIMESTAMP: pipeline healthy (run_age=${{ steps.evaluate.outputs.RUN_AGE_MIN }}m, api_age=${{ steps.evaluate.outputs.API_AGE_MIN }}m)." || true
          done
