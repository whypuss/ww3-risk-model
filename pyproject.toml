[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ww3-risk-model"
version = "0.4.1"
description = "WW3 Risk Model — five-layer structural risk index: resources, distribution, employment/AI displacement, power/security dilemma, future fear, gated by peace-mechanism failure"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "whypuss"}
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
ww3-risk = "ww3_risk.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
